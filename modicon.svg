<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242c33"/>
      <stop offset="65%" stop-color="#14191d"/>
      <stop offset="100%" stop-color="#0a0d0f"/>
    </radialGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d98943"/>
      <stop offset="30%" stop-color="#8b431b"/>
      <stop offset="70%" stop-color="#bf6c2c"/>
      <stop offset="100%" stop-color="#4a1f0a"/>
    </linearGradient>

    <linearGradient id="steelGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#d4dee5"/>
      <stop offset="60%" stop-color="#889dae"/>
      <stop offset="90%" stop-color="#4c5d6b"/>
      <stop offset="100%" stop-color="#29343d"/>
    </linearGradient>

    <linearGradient id="steelEdgeGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e9f2f8"/>
      <stop offset="100%" stop-color="#9bb3c4"/>
    </linearGradient>

    <linearGradient id="falxSpineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d4952"/>
      <stop offset="50%" stop-color="#212a30"/>
      <stop offset="100%" stop-color="#141b20"/>
    </linearGradient>

    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#845028"/>
      <stop offset="50%" stop-color="#553014"/>
      <stop offset="100%" stop-color="#341b08"/>
    </linearGradient>

    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed668"/>
      <stop offset="50%" stop-color="#b88322"/>
      <stop offset="100%" stop-color="#6e4905"/>
    </linearGradient>

    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e62029"/>
      <stop offset="40%" stop-color="#b30912"/>
      <stop offset="100%" stop-color="#4d0004"/>
    </linearGradient>

    <radialGradient id="bloodGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1a27" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#990b14" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Circle Background with Bronze Rim -->
  <circle cx="256" cy="256" r="246" fill="url(#rimGrad)" stroke="#1a0c05" stroke-width="4"/>
  <circle cx="256" cy="256" r="236" fill="#121619" stroke="#36170a" stroke-width="2"/>
  <circle cx="256" cy="256" r="230" fill="url(#bgGrad)"/>

  <!-- Radar / Hunter's Tracking Crosshair Motif -->
  <g opacity="0.22">
    <circle cx="256" cy="256" r="190" fill="none" stroke="#d43f3f" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="256" cy="256" r="130" fill="none" stroke="#d43f3f" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="70" fill="none" stroke="#d43f3f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="256" y1="40" x2="256" y2="472" stroke="#d43f3f" stroke-width="1.5" stroke-dasharray="6 6"/>
    <line x1="40" y1="256" x2="472" y2="256" stroke="#d43f3f" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>

  <!-- Ambient Blood Aura Behind Blade -->
  <circle cx="340" cy="180" r="140" fill="url(#bloodGlow)"/>
  <circle cx="230" cy="240" r="110" fill="url(#bloodGlow)"/>

  <!-- The Falx Weapon -->
  <g filter="url(#dropShadow)">
    <!-- Wooden Long Hilt -->
    <path d="M 85 410 L 175 320 L 195 340 L 105 430 Z" fill="url(#woodGrad)" stroke="#231206" stroke-width="2"/>

    <!-- Leather Wrappings on Grip -->
    <path d="M 98 397 L 118 417 M 115 380 L 135 400 M 132 363 L 152 383 M 149 346 L 169 366 M 166 329 L 186 349"
          stroke="#1d1108" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 98 397 L 118 417 M 115 380 L 135 400 M 132 363 L 152 383 M 149 346 L 169 366 M 166 329 L 186 349"
          stroke="#9c6d3d" stroke-width="2" stroke-linecap="round"/>

    <!-- Brass Pommel -->
    <circle cx="92" cy="423" r="14" fill="url(#brassGrad)" stroke="#3d2602" stroke-width="2"/>
    <circle cx="92" cy="423" r="5" fill="#fed668" opacity="0.6"/>

    <!-- Brass Crossguard / Collar -->
    <polygon points="172,308 214,350 200,364 158,322" fill="url(#brassGrad)" stroke="#382103" stroke-width="2"/>
    <circle cx="186" cy="336" r="4" fill="#301c03"/>

    <!-- Curved Falx Blade Spine (Dark reinforced backing) -->
    <path d="M 185 315
             C 240 260, 290 195, 345 130
             C 385 85, 415 55, 435 60
             C 425 80, 395 125, 350 195
             C 305 260, 255 315, 205 345
             Z"
          fill="url(#falxSpineGrad)" stroke="#1a2024" stroke-width="2"/>

    <!-- Falx Razor Cutting Edge (Concave curve, gleaming tempered steel) -->
    <path d="M 198 330
             C 255 285, 305 230, 355 170
             C 395 120, 422 80, 435 60
             C 400 95, 340 170, 275 245
             C 235 290, 205 320, 198 330
             Z"
          fill="url(#steelGrad)"/>

    <!-- Inner Razor Highlight (The deadly concave slicing edge) -->
    <path d="M 435 60
             C 390 100, 335 175, 275 245
             C 230 295, 200 325, 195 332"
          fill="none" stroke="url(#steelEdgeGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Reinforcement Rivets along the Blade Spine -->
    <circle cx="230" cy="275" r="3.5" fill="url(#brassGrad)" stroke="#221402"/>
    <circle cx="280" cy="225" r="3.5" fill="url(#brassGrad)" stroke="#221402"/>
    <circle cx="330" cy="175" r="3.5" fill="url(#brassGrad)" stroke="#221402"/>
    <circle cx="375" cy="128" r="3" fill="url(#brassGrad)" stroke="#221402"/>
  </g>

  <!-- Blood Splatters & Arterial Droplets -->
  <g filter="url(#dropShadow)">
    <!-- Main Crimson Drop dripping from the hook tip -->
    <path d="M 435 60
             C 442 80, 455 110, 442 125
             C 432 135, 418 125, 425 105
             Z"
          fill="url(#bloodGrad)"/>

    <!-- Blood dripping along concave edge -->
    <path d="M 370 140
             C 380 150, 385 170, 378 178
             C 372 184, 362 178, 365 160
             Z"
          fill="url(#bloodGrad)"/>

    <path d="M 315 200
             C 322 210, 325 225, 318 232
             C 312 238, 305 230, 308 215
             Z"
          fill="url(#bloodGrad)"/>

    <!-- Dynamic Falling Blood Beads -->
    <!-- Large Drop -->
    <path d="M 445 155
             C 445 155, 458 178, 458 188
             A 13 13 0 1 1 432 188
             C 432 178, 445 155, 445 155 Z"
          fill="url(#bloodGrad)"/>
    <ellipse cx="442" cy="184" rx="3.5" ry="6" fill="#ff7070" opacity="0.65"/>

    <!-- Medium Drop -->
    <path d="M 382 205
             C 382 205, 392 222, 392 230
             A 10 10 0 1 1 372 230
             C 372 222, 382 205, 382 205 Z"
          fill="url(#bloodGrad)"/>
    <ellipse cx="380" cy="227" rx="2.5" ry="4.5" fill="#ff7070" opacity="0.65"/>

    <!-- Small Splash Droplets -->
    <circle cx="465" cy="225" r="5" fill="url(#bloodGrad)"/>
    <circle cx="430" cy="235" r="6.5" fill="url(#bloodGrad)"/>
    <circle cx="400" cy="265" r="4.5" fill="url(#bloodGrad)"/>
    <circle cx="448" cy="255" r="3.5" fill="url(#bloodGrad)"/>
    <circle cx="348" cy="255" r="5" fill="url(#bloodGrad)"/>
    <circle cx="325" cy="275" r="4" fill="url(#bloodGrad)"/>
    <circle cx="280" cy="305" r="4.5" fill="url(#bloodGrad)"/>
  </g>

  <!-- Hunter's Mark Insignia (Bottom Left) -->
  <g opacity="0.85" filter="url(#dropShadow)">
    <circle cx="115" cy="165" r="38" fill="#1b2126" stroke="url(#rimGrad)" stroke-width="3"/>
    <!-- Crosshair / Tracking Eye Icon -->
    <path d="M 90 165 Q 115 142 140 165 Q 115 188 90 165 Z" fill="none" stroke="#e62029" stroke-width="2.5"/>
    <circle cx="115" cy="165" r="9" fill="#990b14" stroke="#ff4d4d" stroke-width="1.5"/>
    <circle cx="115" cy="165" r="3.5" fill="#ffffff"/>
    <line x1="115" y1="140" x2="115" y2="148" stroke="#ff4d4d" stroke-width="2"/>
    <line x1="115" y1="182" x2="115" y2="190" stroke="#ff4d4d" stroke-width="2"/>
    <line x1="90" y1="165" x2="98" y2="165" stroke="#ff4d4d" stroke-width="2"/>
    <line x1="132" y1="165" x2="140" y2="165" stroke="#ff4d4d" stroke-width="2"/>
  </g>

  <!-- Subtle Vignette & Specular Rim Light -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
</svg>
