<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14191d"/>
      <stop offset="50%" stop-color="#182026"/>
      <stop offset="100%" stop-color="#0f1316"/>
    </linearGradient>

    <linearGradient id="bronzeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e09953"/>
      <stop offset="35%" stop-color="#9a4d1d"/>
      <stop offset="70%" stop-color="#c87932"/>
      <stop offset="100%" stop-color="#54230c"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a333c"/>
      <stop offset="50%" stop-color="#3b1d1d"/>
      <stop offset="100%" stop-color="#2a333c"/>
    </linearGradient>

    <radialGradient id="bloodVignette" cx="50%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#800a12" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#380407" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Column Pill Gradients -->
    <linearGradient id="subtlePill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#223b4d"/>
      <stop offset="100%" stop-color="#162733"/>
    </linearGradient>

    <linearGradient id="defaultPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e3e15"/>
      <stop offset="100%" stop-color="#3b250a"/>
    </linearGradient>

    <linearGradient id="bloodlustPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a1219"/>
      <stop offset="100%" stop-color="#4d050a"/>
    </linearGradient>

    <!-- Tier Badges -->
    <linearGradient id="t0Badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64717b"/>
      <stop offset="100%" stop-color="#3b444b"/>
    </linearGradient>
    <linearGradient id="t1Badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d47942"/>
      <stop offset="100%" stop-color="#8c4118"/>
    </linearGradient>
    <linearGradient id="t2Badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9a84e"/>
      <stop offset="100%" stop-color="#8a611c"/>
    </linearGradient>
    <linearGradient id="t3Badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a9cb8"/>
      <stop offset="100%" stop-color="#3d576e"/>
    </linearGradient>
    <linearGradient id="t4Badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2effa"/>
      <stop offset="100%" stop-color="#7b9cb3"/>
    </linearGradient>
    <linearGradient id="t5Badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c96bf2"/>
      <stop offset="100%" stop-color="#692287"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #f0e6d2; letter-spacing: 1.5px; }
    .subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #b89876; letter-spacing: 1px; }
    .col-hdr { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.8px; }
    .row-tier { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .row-mat { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #e2eaf0; }
    .val-text { font-family: 'SF Mono', Consolas, 'Courier New', monospace; font-size: 14px; font-weight: 700; }
    .duration-val { font-family: 'SF Mono', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #ffd15c; }
    .footer-text { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13.5px; font-weight: 600; fill: #eed9b3; }
    .footer-highlight { fill: #ff4a4a; font-weight: 700; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="15" y="15" width="1170" height="620" rx="14" fill="url(#bgGrad)" stroke="url(#bronzeBorder)" stroke-width="4" filter="url(#shadow)"/>
  <rect x="23" y="23" width="1154" height="604" rx="10" fill="none" stroke="#2a333d" stroke-width="1.5"/>

  <!-- Blood Vignette Behind Header -->
  <rect x="25" y="25" width="1150" height="600" rx="9" fill="url(#bloodVignette)"/>

  <!-- Header Plate -->
  <path d="M 25 25 L 1175 25 L 1175 98 L 25 98 Z" fill="url(#headerGrad)"/>
  <line x1="25" y1="98" x2="1175" y2="98" stroke="url(#bronzeBorder)" stroke-width="2"/>

  <!-- Title & Icon -->
  <g transform="translate(60, 36)">
    <!-- Red Drop Icon -->
    <path d="M 0 32 C -8 18, -12 10, -12 2 C -12 -8, -5 -14, 0 -22 C 5 -14, 12 -8, 12 2 C 12 10, 8 18, 0 32 Z" fill="#e62029" stroke="#ff7373" stroke-width="1.5" transform="translate(0, 8) scale(0.85)"/>
    <text x="24" y="20" class="title">BLEED TIERS &amp; DAMAGE PRESETS</text>
    <text x="24" y="41" class="subtitle">WEAPON MATERIAL SCALING • DAMAGE OVER TIME (DPS) • DURATION</text>
  </g>

  <!-- Command Shortcut Pill in Header -->
  <g transform="translate(910, 44)">
    <rect x="0" y="0" width="225" height="34" rx="6" fill="#1b2228" stroke="#d98943" stroke-width="1.5"/>
    <text x="112.5" y="17" text-anchor="middle" dominant-baseline="central" font-family="'SF Mono', Consolas, monospace" font-size="12.5" font-weight="700" fill="#ffd15c">/bnh bleeding &lt;preset&gt;</text>
  </g>

  <!-- Table Column Headers -->
  <g transform="translate(45, 114)">
    <rect x="0" y="0" width="1110" height="42" rx="6" fill="#101519" stroke="#2b343d" stroke-width="1"/>
    
    <text x="25" y="21" dominant-baseline="central" class="col-hdr" fill="#a4b3c2">TIER &amp; MATERIAL</text>
    <text x="460" y="21" text-anchor="middle" dominant-baseline="central" class="col-hdr" fill="#ffd15c">DURATION</text>
    
    <!-- Presets Header Chips -->
    <g transform="translate(560, 7)">
      <rect x="0" y="0" width="165" height="28" rx="5" fill="url(#subtlePill)" stroke="#395c73" stroke-width="1"/>
      <text x="82.5" y="14" text-anchor="middle" dominant-baseline="central" class="col-hdr" fill="#8ed0f8">SUBTLE (50%)</text>
    </g>

    <g transform="translate(745, 7)">
      <rect x="0" y="0" width="165" height="28" rx="5" fill="url(#defaultPill)" stroke="#946324" stroke-width="1"/>
      <text x="82.5" y="14" text-anchor="middle" dominant-baseline="central" class="col-hdr" fill="#fed668">DEFAULT (100%)</text>
    </g>

    <g transform="translate(930, 7)">
      <rect x="0" y="0" width="165" height="28" rx="5" fill="url(#bloodlustPill)" stroke="#b31e28" stroke-width="1"/>
      <text x="82.5" y="14" text-anchor="middle" dominant-baseline="central" class="col-hdr" fill="#ff7070">BLOODLUST (150%)</text>
    </g>
  </g>

  <!-- ==================== ROWS ==================== -->

  <!-- ROW 0: Tier 0 -->
  <g transform="translate(45, 168)">
    <rect x="0" y="0" width="1110" height="56" rx="6" fill="#182026" stroke="#252d35" stroke-width="1"/>
    
    <!-- Tier Badge -->
    <rect x="18" y="10" width="80" height="36" rx="6" fill="url(#t0Badge)" stroke="#7d8d99" stroke-width="1"/>
    <text x="58" y="28" text-anchor="middle" dominant-baseline="central" class="row-tier">TIER 0</text>
    
    <!-- Materials -->
    <text x="115" y="28" dominant-baseline="central" class="row-mat">Flint, Stone, Bone</text>

    <!-- Duration -->
    <rect x="415" y="11" width="90" height="34" rx="6" fill="#101519" stroke="#36424d" stroke-width="1"/>
    <text x="460" y="28" text-anchor="middle" dominant-baseline="central" class="duration-val">2.0s</text>

    <!-- Subtle -->
    <rect x="560" y="11" width="165" height="34" rx="6" fill="#121d24" stroke="#243745" stroke-width="1"/>
    <text x="642.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#78bde6">0.13 DPS</text>

    <!-- Default -->
    <rect x="745" y="11" width="165" height="34" rx="6" fill="#1f180f" stroke="#4a371c" stroke-width="1"/>
    <text x="827.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#fed668">0.25 DPS</text>

    <!-- Bloodlust -->
    <rect x="930" y="11" width="165" height="34" rx="6" fill="#240c0e" stroke="#5e151a" stroke-width="1"/>
    <text x="1012.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#ff6b6b">0.38 DPS</text>
  </g>

  <!-- ROW 1: Tier 1 -->
  <g transform="translate(45, 234)">
    <rect x="0" y="0" width="1110" height="56" rx="6" fill="#1a2228" stroke="#252d35" stroke-width="1"/>
    
    <rect x="18" y="10" width="80" height="36" rx="6" fill="url(#t1Badge)" stroke="#f29b63" stroke-width="1"/>
    <text x="58" y="28" text-anchor="middle" dominant-baseline="central" class="row-tier">TIER 1</text>
    
    <text x="115" y="28" dominant-baseline="central" class="row-mat">Copper, Scrap Iron</text>

    <rect x="415" y="11" width="90" height="34" rx="6" fill="#101519" stroke="#36424d" stroke-width="1"/>
    <text x="460" y="28" text-anchor="middle" dominant-baseline="central" class="duration-val">3.0s</text>

    <rect x="560" y="11" width="165" height="34" rx="6" fill="#121d24" stroke="#243745" stroke-width="1"/>
    <text x="642.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#78bde6">0.23 DPS</text>

    <rect x="745" y="11" width="165" height="34" rx="6" fill="#1f180f" stroke="#4a371c" stroke-width="1"/>
    <text x="827.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#fed668">0.45 DPS</text>

    <rect x="930" y="11" width="165" height="34" rx="6" fill="#240c0e" stroke="#5e151a" stroke-width="1"/>
    <text x="1012.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#ff6b6b">0.68 DPS</text>
  </g>

  <!-- ROW 2: Tier 2 -->
  <g transform="translate(45, 300)">
    <rect x="0" y="0" width="1110" height="56" rx="6" fill="#182026" stroke="#252d35" stroke-width="1"/>
    
    <rect x="18" y="10" width="80" height="36" rx="6" fill="url(#t2Badge)" stroke="#fed668" stroke-width="1"/>
    <text x="58" y="28" text-anchor="middle" dominant-baseline="central" class="row-tier">TIER 2</text>
    
    <text x="115" y="28" dominant-baseline="central" class="row-mat">Bronze (Tin, Bismuth, Black)</text>

    <rect x="415" y="11" width="90" height="34" rx="6" fill="#101519" stroke="#36424d" stroke-width="1"/>
    <text x="460" y="28" text-anchor="middle" dominant-baseline="central" class="duration-val">4.0s</text>

    <rect x="560" y="11" width="165" height="34" rx="6" fill="#121d24" stroke="#243745" stroke-width="1"/>
    <text x="642.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#78bde6">0.33 DPS</text>

    <rect x="745" y="11" width="165" height="34" rx="6" fill="#1f180f" stroke="#4a371c" stroke-width="1"/>
    <text x="827.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#fed668">0.65 DPS</text>

    <rect x="930" y="11" width="165" height="34" rx="6" fill="#240c0e" stroke="#5e151a" stroke-width="1"/>
    <text x="1012.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#ff6b6b">0.98 DPS</text>
  </g>

  <!-- ROW 3: Tier 3 -->
  <g transform="translate(45, 366)">
    <rect x="0" y="0" width="1110" height="56" rx="6" fill="#1a2228" stroke="#252d35" stroke-width="1"/>
    
    <rect x="18" y="10" width="80" height="36" rx="6" fill="url(#t3Badge)" stroke="#a1c2de" stroke-width="1"/>
    <text x="58" y="28" text-anchor="middle" dominant-baseline="central" class="row-tier">TIER 3</text>
    
    <text x="115" y="28" dominant-baseline="central" class="row-mat">Iron &amp; Meteoric Iron</text>

    <rect x="415" y="11" width="90" height="34" rx="6" fill="#101519" stroke="#36424d" stroke-width="1"/>
    <text x="460" y="28" text-anchor="middle" dominant-baseline="central" class="duration-val">4.0s</text>

    <rect x="560" y="11" width="165" height="34" rx="6" fill="#121d24" stroke="#243745" stroke-width="1"/>
    <text x="642.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#78bde6">0.40 DPS</text>

    <rect x="745" y="11" width="165" height="34" rx="6" fill="#1f180f" stroke="#4a371c" stroke-width="1"/>
    <text x="827.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#fed668">0.80 DPS</text>

    <rect x="930" y="11" width="165" height="34" rx="6" fill="#240c0e" stroke="#5e151a" stroke-width="1"/>
    <text x="1012.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#ff6b6b">1.20 DPS</text>
  </g>

  <!-- ROW 4: Tier 4 -->
  <g transform="translate(45, 432)">
    <rect x="0" y="0" width="1110" height="56" rx="6" fill="#182026" stroke="#252d35" stroke-width="1"/>
    
    <rect x="18" y="10" width="80" height="36" rx="6" fill="url(#t4Badge)" stroke="#ffffff" stroke-width="1"/>
    <text x="58" y="28" text-anchor="middle" dominant-baseline="central" class="row-tier" fill="#101519">TIER 4</text>
    
    <text x="115" y="28" dominant-baseline="central" class="row-mat">Steel</text>

    <rect x="415" y="11" width="90" height="34" rx="6" fill="#101519" stroke="#36424d" stroke-width="1"/>
    <text x="460" y="28" text-anchor="middle" dominant-baseline="central" class="duration-val">5.0s</text>

    <rect x="560" y="11" width="165" height="34" rx="6" fill="#121d24" stroke="#243745" stroke-width="1"/>
    <text x="642.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#78bde6">0.50 DPS</text>

    <rect x="745" y="11" width="165" height="34" rx="6" fill="#1f180f" stroke="#4a371c" stroke-width="1"/>
    <text x="827.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#fed668">1.00 DPS</text>

    <rect x="930" y="11" width="165" height="34" rx="6" fill="#240c0e" stroke="#5e151a" stroke-width="1"/>
    <text x="1012.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#ff6b6b">1.50 DPS</text>
  </g>

  <!-- ROW 5: Tier 5 -->
  <g transform="translate(45, 498)">
    <rect x="0" y="0" width="1110" height="56" rx="6" fill="#1a2228" stroke="#252d35" stroke-width="1"/>
    
    <rect x="18" y="10" width="80" height="36" rx="6" fill="url(#t5Badge)" stroke="#ea9eff" stroke-width="1"/>
    <text x="58" y="28" text-anchor="middle" dominant-baseline="central" class="row-tier">TIER 5</text>
    
    <text x="115" y="28" dominant-baseline="central" class="row-mat">Exotic &amp; High-Tier</text>

    <rect x="415" y="11" width="90" height="34" rx="6" fill="#101519" stroke="#36424d" stroke-width="1"/>
    <text x="460" y="28" text-anchor="middle" dominant-baseline="central" class="duration-val">6.0s</text>

    <rect x="560" y="11" width="165" height="34" rx="6" fill="#121d24" stroke="#243745" stroke-width="1"/>
    <text x="642.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#78bde6">0.63 DPS</text>

    <rect x="745" y="11" width="165" height="34" rx="6" fill="#1f180f" stroke="#4a371c" stroke-width="1"/>
    <text x="827.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#fed668">1.25 DPS</text>

    <rect x="930" y="11" width="165" height="34" rx="6" fill="#240c0e" stroke="#5e151a" stroke-width="1"/>
    <text x="1012.5" y="28" text-anchor="middle" dominant-baseline="central" class="val-text" fill="#ff6b6b">1.88 DPS</text>
  </g>

  <!-- ==================== FOOTER: FALX SYNERGY BANNER ==================== -->
  <g transform="translate(45, 566)">
    <rect x="0" y="0" width="1110" height="52" rx="8" fill="#151d22" stroke="url(#bronzeBorder)" stroke-width="2"/>
    
    <text x="25" y="26" dominant-baseline="central" class="footer-text">
      🗡️ <tspan fill="#ffd15c">FALX WEAPON MASTERY:</tspan> Inflicts brutal lacerations (<tspan class="footer-highlight">+50% Bleed DPS</tspan>) and grants <tspan fill="#78bde6">Extended Reach (3.0m)</tspan>.
    </text>

    <!-- Toggle Note Pill -->
    <g transform="translate(930, 10)">
      <rect x="0" y="0" width="165" height="32" rx="5" fill="#1e272e" stroke="#d98943" stroke-width="1"/>
      <text x="82.5" y="16" text-anchor="middle" dominant-baseline="central" font-family="'SF Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#fed668">/bnh falx [on|off]</text>
    </g>
  </g>

</svg>
